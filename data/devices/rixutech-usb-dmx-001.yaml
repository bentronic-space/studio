id: rixutech-usb-dmx-001
name: RIXUTECH USB-DMX Interface
type: dmx_interface

status: active
location: studio

ports:
  - id: usb
    name: USB
    type: usb
    connector: usb_a
    direction: bidirectional

  - id: dmx_out
    name: DMX OUT
    type: dmx
    connector: xlr_3_female
    direction: output

capabilities:
  technical:
    - usb
    - dmx
    - dmx512
    - rs485
    - usb_to_dmx
    - linux
    - windows
    - macos

  musical: []

specifications:
  manufacturer: RIXUTECH
  model: RX-485-USB-DMX-009
  chipset: FT232RL
  protocol: DMX512
  physical_layer: RS485
  xlr_pins: 3
  cable_length_m: 5
  usb_powered: true

software:
  qlc_plus:
    supported: true
    tested: true
    mode: "Open TX"

current_connection:
  host: fujitsu-e556
  interface: usb

future:
  possible_host:
    - raspberry_pi

firmware:
  version: unknown

notes:
  - "Digital Twin initial entry"
  - "Current setup: USB connected to Fujitsu LIFEBOOK E556."
  - "DMX output uses 3-pin XLR female connector."
  - "Actual cable length: 5 m."
  - "FT232RL USB-to-RS485 chipset."
  - "QLC+ tested successfully with Open TX mode."
  - "May later be connected to a Raspberry Pi as a DMX node."
