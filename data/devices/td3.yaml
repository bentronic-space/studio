id: td3
name: Behringer TD-3
type: synthesizer

status: active
location: studio

ports:
  - id: midi_in
    name: MIDI IN
    type: midi
    connector: din5
    transport: midi_din
    direction: input

  - id: midi_out
    name: MIDI OUT
    type: midi
    connector: din5
    transport: midi_din
    direction: output

  - id: midi_usb
    name: USB MIDI
    type: midi
    connector: usb_b
    transport: midi_usb
    direction: bidirectional

  - id: midi_power
    name: Power
    type: power
    connector: dc
    direction: input

  - id: audio_out
    name: Audio OUT
    type: audio
    connector: jack_6_35_trs
    direction: output
    balanced: false

  - id: headphones_out
    name: Headphones
    type: audio
    connector: jack_3_5_trs
    direction: output

  - id: filter_in
    name: Filter IN
    type: audio
    connector: jack_3_5
    direction: input

  - id: sync_in
    name: Sync IN
    type: sync
    connector: jack_3_5
    direction: input

  - id: cv_out
    name: CV OUT
    type: cv
    connector: jack_3_5
    direction: output
    voltage_range: "1V to 5V"
    scaling: 1v_per_octave

  - id: gate_out
    name: GATE OUT
    type: gate
    connector: jack_3_5
    direction: output
    voltage_off: "0V"
    voltage_on: "+12V"

capabilities:
  technical:
    - midi
    - midi_din
    - midi_usb
    - midi_thru
    - sequencer
    - cv
    - gate
    - sync
    - external_filter_input

  musical:
    - bass
    - acid
    - monophonic
    - analog_synthesis

specifications:
  voices: 1
  synthesis: analog
  oscillators: 1
  filter: low_pass
  envelopes: 1
  power_consumption_w: 2

firmware:
  version: unknown

notes:
  - "Digital Twin initial entry"
  - "Audio output uses TRS connector but is unbalanced."
